name: Backend build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AutoServiceManagement.slnx
      - name: Build
        run: dotnet build AutoServiceManagement.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AutoServiceManagement.slnx --configuration Release --no-build
